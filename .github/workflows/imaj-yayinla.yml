# Depoya (main dalına) her gönderimde üretim imajını derleyip GitHub Container
# Registry'ye (ghcr.io) yayınlar. İş bilgisayarı bu imajı indirip güncellenir;
# o bilgisayarda derleme yapılmaz.
name: imaj-yayinla

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  derle-ve-yayinla:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Buildx hazırla
        uses: docker/setup-buildx-action@v3

      - name: ghcr.io oturumu
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io imaj adları küçük harf olmak zorunda; depo adını küçülterek kullanırız.
      - name: İmaj adını hazırla
        id: imaj
        run: echo "ad=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Derle ve yayınla
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.imaj.outputs.ad }}:latest
            ${{ steps.imaj.outputs.ad }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Özet
        run: |
          echo "Yayınlanan imaj: ${{ steps.imaj.outputs.ad }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "Sürüm etiketi: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
